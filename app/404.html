<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — HelloStudents</title>
  <script>
    /*  Runs before anything is drawn, so a dark-mode visitor
        never sees a white flash first. It has to be inline and
        in the head: a module file would load too late.
        The key must match KEY in js/theme.js.  */
    (function () {
      try {
        var t = localStorage.getItem('hs-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

  <div id="topbar"></div>

  <main class="auth">
    <div class="auth-card">
      <div class="card center">
        <div class="empty-ico" id="nf-icon"></div>
        <h1 class="mt-sm">This page does not exist</h1>
        <p class="lead mt-sm">
          The link may be old, or the address may have a typo in it.
        </p>

        <div class="row center-row mt-md">
          <a class="btn" href="index.html">Go to home</a>
          <a class="btn btn-outline" href="browse.html">Find a batch</a>
        </div>

        <p class="hint mt">
          Still stuck? <a href="help.html#contact">Contact us</a>.
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="js/notfound.js?v=6"></script>

</body>
</html>
