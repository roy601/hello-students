<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My tutor profile — HelloStudents</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="topbar"></div>
  <div id="page-hero"></div>

  <main class="page mid">

    
    <div id="status-area" class="mb-md"></div>

    <section class="card mb-md">
      <h2>About you</h2>
      <p class="muted mb">Students see this on every batch you open.</p>

      <form id="about-form" class="form">
        <div class="field">
          <label for="headline">Headline</label>
          <input id="headline" type="text" maxlength="120"
                 placeholder="HSC Physics · 8 years · 200+ students to A+" />
          <p class="hint">One short line describing what you teach.</p>
        </div>

        <div class="field">
          <label for="bio">About you</label>
          <textarea id="bio" rows="4"
                    placeholder="Tell students how you teach and what results you get."></textarea>
        </div>

        <div class="pair">
          <div class="field">
            <label for="experience">Years of experience</label>
            <input id="experience" type="number" min="0" max="60" value="0" />
          </div>
          <div class="field">
            <label for="area">Your main area</label>
            <select id="area"></select>
          </div>
        </div>

        <button class="btn" type="submit" id="about-btn">Save profile</button>
      </form>
    </section>

    <section class="card">
      <h2>Certificates</h2>
      <p class="muted mb">
        Add your degrees. Our team checks them, and a checked badge makes
        students far more likely to join your batch.
      </p>

      <div id="cred-list" class="stack-sm mb"></div>

      <form id="cred-form" class="form">
        <div class="pair">
          <div class="field">
            <label for="cred-title">Certificate</label>
            <input id="cred-title" type="text" required placeholder="BSc in EEE" />
          </div>
          <div class="field">
            <label for="cred-inst">Institution</label>
            <input id="cred-inst" type="text" required placeholder="BUET" />
          </div>
        </div>

        <div class="field">
          <label for="cred-year">Year</label>
          <input id="cred-year" type="number" min="1970" max="2030" placeholder="2019" />
        </div>

        <button class="btn btn-outline" type="submit" id="cred-btn">Add certificate</button>
      </form>
    </section>

  </main>

  <script type="module" src="js/tutor-profile.js"></script>

</body>
</html>
