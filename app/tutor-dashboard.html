<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — HelloStudents</title>
  <script>
    /*  Runs before anything is drawn, so a dark-mode visitor
        never sees a white flash first. It has to be inline and
        in the head: a module file would load too late.
        The key must match KEY in js/theme.js.  */
    (function () {
      try {
        var t = localStorage.getItem('hs-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

  <div id="topbar"></div>
  <div id="page-hero"></div>

  <main class="page mid">

    <div id="status-area" class="mb-md"></div>

    <section class="grid-4 mb-md stagger" id="stats"></section>

    <section class="card mb-md">
      <div class="card-head">
        <h2>My batches</h2>
        <a class="btn btn-outline btn-sm" href="tutor-batches.html">Manage</a>
      </div>
      <div id="batches"></div>
    </section>

    <section id="payout" class="mb-md"></section>

    <section class="card">
      <h2 class="mb">Recent earnings</h2>
      <div id="earnings"></div>
    </section>

  </main>

  <script type="module" src="js/tutor-dashboard.js?v=6"></script>

</body>
</html>
