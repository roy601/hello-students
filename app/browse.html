<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a batch — HelloStudents</title>
  <script>
    /*  Runs before anything is drawn, so a dark-mode visitor
        never sees a white flash first. It has to be inline and
        in the head: a module file would load too late.
        The key must match KEY in js/theme.js.  */
    (function () {
      try {
        var t = localStorage.getItem('hs-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

  <div id="topbar"></div>
  <div id="page-hero"></div>

  <main class="page">

    <section class="filters mb">
      <div class="field">
        <label for="f-subject">Subject</label>
        <select id="f-subject"><option value="">Any subject</option></select>
      </div>

      <div class="field">
        <label for="f-grade">Class / level</label>
        <select id="f-grade"><option value="">Any class</option></select>
      </div>

      <div class="field">
        <label for="f-area">Area</label>
        <select id="f-area"><option value="">Any area</option></select>
      </div>

      <div class="field">
        <label for="f-fee">Monthly fee up to</label>
        <select id="f-fee">
          <option value="">Any fee</option>
          <option value="1000">&#2547;1,000</option>
          <option value="2000">&#2547;2,000</option>
          <option value="3000">&#2547;3,000</option>
          <option value="5000">&#2547;5,000</option>
        </select>
      </div>

      <div class="field">
        <label for="f-mode">Class type</label>
        <select id="f-mode">
          <option value="">Online or in person</option>
          <option value="online">Online only</option>
          <option value="person">In person only</option>
        </select>
      </div>

      <div class="field">
        <label for="f-search">Search</label>
        <input id="f-search" type="search" placeholder="Batch or tutor name" />
      </div>

      <div class="field">
        <label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="fee">Lowest fee</option>
          <option value="rating">Best rated</option>
          <option value="new">Newest</option>
        </select>
      </div>
    </section>

    <div class="row mb">
      <p class="muted" id="result-count"></p>
      <div class="spacer"></div>
      <button class="btn btn-outline btn-sm" id="clear-filters" type="button">
        Clear filters
      </button>
    </div>

    <section id="results" class="stack-sm"></section>

  </main>

  <script type="module" src="js/browse.js?v=6"></script>

</body>
</html>
