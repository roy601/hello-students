<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdrawals — HelloStudents</title>
  <script>
    /*  Runs before anything is drawn, so a dark-mode visitor
        never sees a white flash first. It has to be inline and
        in the head: a module file would load too late.
        The key must match KEY in js/theme.js.  */
    (function () {
      try {
        var t = localStorage.getItem('hs-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

  <div id="topbar"></div>
  <div id="page-hero"></div>

  <main class="page">

    <section class="grid-4 mb-md stagger" id="payout-stats"></section>

    <div class="card mb-md">
      <div class="card-head">
        <h2>Waiting to be sent</h2>
        <span class="badge badge-warning" id="pending-count">—</span>
      </div>
      <p class="hint mb">
        Send the money by bKash or Nagad yourself, then mark it paid
        here. The amount already left the tutor's wallet when they
        asked, so marking it paid moves nothing — it only records
        that you sent it.
      </p>
      <div id="pending-list"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Already settled</h2>
      </div>
      <div id="settled-list"></div>
    </div>

  </main>

  <script type="module" src="js/admin-payouts.js?v=6"></script>

</body>
</html>
