<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch details — HelloStudents</title>
  <script>
    /*  Runs before anything is drawn, so a dark-mode visitor
        never sees a white flash first. It has to be inline and
        in the head: a module file would load too late.
        The key must match KEY in js/theme.js.  */
    (function () {
      try {
        var t = localStorage.getItem('hs-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

  <div id="topbar"></div>

  <main class="page mid">
    <p class="mb"><a href="browse.html">&#8592; Back to all batches</a></p>
    <div id="content"></div>
  </main>

  <script type="module" src="js/batch.js?v=6"></script>

</body>
</html>
