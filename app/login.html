<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — HelloStudents</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="topbar"></div>
  <div id="page-hero"></div>

  <main class="page narrow">
        
    <form id="login-form" class="card form">

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Your password" />
      </div>

      <button class="btn btn-block" type="submit" id="submit-btn">Log in</button>
    </form>

    <p class="muted center mt">
      New here? <a href="register.html">Create an account</a>
    </p>
  </main>

  <script type="module" src="js/login.js"></script>

</body>
</html>
