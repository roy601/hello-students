<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — HelloStudents</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html">HelloStudents</a>
    <nav id="nav-links"></nav>
  </header>

  <main class="page narrow">
    <h1>Login</h1>

    <form id="login-form" class="form">

      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="Your password" />

      <button class="btn" type="submit">Login</button>
    </form>

    <p id="message" class="message"></p>
    <p class="muted">No account yet? <a href="register.html">Register</a></p>
  </main>

  <script type="module" src="js/login.js"></script>

</body>
</html>
