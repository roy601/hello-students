<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: "Hind Siliguri", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
      background: #FAF7F2;
      color: #1C1A17;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #635BFF; text-decoration: none; }
    a:hover { color: #312E81; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1280px; min-height: 1000px; background: #FAF7F2; position: relative; overflow: hidden">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(28,26,23,.035) 0 1px, transparent 1px 34px); pointer-events: none"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 16px; max-width: 1140px; margin: 0 auto; padding: 26px 40px 0">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700">
      <span style="width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(100deg, #635BFF 0%, #8B5CF6 52%, #38BDF8 100%)"></span>
      HelloStudents
    </div>

    <div style="display: flex; align-items: center; gap: 4px; margin-left: auto">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
        <button type="button" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
      </sc-for>
      <span style="display: inline-flex; align-items: center; padding: 11px 20px; border-radius: 999px; background: #1C1A17; color: #FAF7F2; font-size: 14.5px; font-weight: 600; margin-left: 12px">{{t.navCta}}</span>
    </div>
  </div>

  <div style="position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 48px; align-items: center; max-width: 1140px; margin: 0 auto; padding: 56px 40px 0">

    <div>
      <div style="display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(28,26,23,.14); font-size: 13.5px; font-weight: 500; color: #5C554B">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"></path><path d="M9 21v-6h6v6"></path></svg>
        {{t.eyebrow}}
      </div>

      <h1 style="font-size: 66px; line-height: 1.14; letter-spacing: -.022em; font-weight: 700; margin: 22px 0 0; text-wrap: balance">{{t.h1a}}<br><span style="color: #B45309">{{t.h1b}}</span></h1>

      <p style="font-size: 20px; line-height: 1.72; color: #5C554B; max-width: 44ch; margin: 20px 0 0">{{t.sub}}</p>

      <div style="display: flex; gap: 12px; margin-top: 30px">
        <span style="display: inline-flex; align-items: center; justify-content: center; padding: 16px 28px; border-radius: 999px; background: #635BFF; color: #fff; font-size: 16.5px; font-weight: 600">{{t.cta}}</span>
        <span style="display: inline-flex; align-items: center; justify-content: center; padding: 16px 28px; border-radius: 999px; border: 1px solid rgba(28,26,23,.18); color: #1C1A17; font-size: 16.5px; font-weight: 600">{{t.cta2}}</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; margin-top: 26px; font-size: 14.5px; color: #5C554B">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        {{t.note}}
      </div>
    </div>

    <div style="border-radius: 22px; border: 1px solid rgba(28,26,23,.12); background: #FFFDFA; padding: 26px; box-shadow: 0 18px 50px rgba(28,26,23,.09)">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #9A9086">{{t.howLabel}}</div>

      <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px">
        <sc-for list="{{t.steps}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; gap: 16px; align-items: flex-start">
            <span style="width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; background: #F3EEE6; color: #B45309; font-size: 17px; font-weight: 700">{{s.n}}</span>
            <div>
              <div style="font-size: 17px; font-weight: 600">{{s.title}}</div>
              <div style="font-size: 14.5px; color: #5C554B; line-height: 1.6; margin-top: 2px">{{s.body}}</div>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="border-top: 1px solid rgba(28,26,23,.1); margin-top: 24px; padding-top: 20px; display: flex; align-items: baseline; gap: 10px">
        <span style="font-size: 34px; font-weight: 700; letter-spacing: -.03em; color: #1C1A17">৳ 2,500</span>
        <span style="font-size: 15px; color: #5C554B">{{t.feeNote}}</span>
      </div>
      <div style="font-size: 14px; color: #5C554B; margin-top: 6px">{{t.cutNote}}</div>
    </div>

  </div>

  <div style="position: relative; max-width: 1140px; margin: 60px auto 0; padding: 0 40px 60px">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #9A9086; margin-bottom: 18px">{{t.batchLabel}}</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{t.batches}}" as="b" hint-placeholder-count="3">
        <div style="border: 1px solid rgba(28,26,23,.12); border-radius: 16px; background: #FFFDFA; padding: 20px">
          <div style="font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #B45309">{{b.tag}}</div>
          <div style="font-size: 18px; font-weight: 600; margin-top: 8px; line-height: 1.35">{{b.title}}</div>
          <div style="font-size: 14px; color: #5C554B; margin-top: 6px">{{b.days}}</div>
          <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 14px">
            <span style="font-size: 22px; font-weight: 700; letter-spacing: -.02em">{{b.fee}}</span>
            <span style="font-size: 13.5px; color: #9A9086">{{t.perMonth}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'bn' };
  }

  renderVals() {
    const lang = this.state.lang;

    const langs = [
      { id: 'bn', label: 'বাংলা' },
      { id: 'en', label: 'English' },
    ].map((l) => ({
      label: l.label,
      pick: () => this.setState({ lang: l.id }),
      style: l.id === lang
        ? 'font: inherit; font-size: 14.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(28,26,23,.16); background: #FFFDFA; color: #1C1A17; cursor: pointer'
        : 'font: inherit; font-size: 14.5px; font-weight: 500; padding: 9px 16px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: #9A9086; cursor: pointer',
    }));

    const bn = {
      navCta: 'শুরু করুন',
      eyebrow: 'কোচিং সেন্টার ছাড়াই পড়ান',
      h1a: 'আপনার ক্লাস।',
      h1b: 'আপনার নিয়ম।',
      sub: 'ব্যাচ খুলুন, লাইভ ক্লাস নিন, আর ফি সরাসরি বুঝে নিন — সবকিছু এক জায়গায়।',
      cta: 'শিক্ষক হিসেবে শুরু করুন',
      cta2: 'ব্যাচ খুঁজুন',
      note: 'শুরু করতে কোনো টাকা লাগে না',
      howLabel: 'তিন ধাপে',
      steps: [
        { n: '১', title: 'প্রোফাইল দিন', body: 'নাম, বিষয় আর সার্টিফিকেট দিন। আমরা যাচাই করে অনুমোদন দেব।' },
        { n: '২', title: 'ব্যাচ খুলুন', body: 'দিন, সময়, আসন সংখ্যা আর মাসিক ফি ঠিক করুন।' },
        { n: '৩', title: 'ফি বুঝে নিন', body: 'শিক্ষার্থী বিকাশ বা নগদে দেবে। টাকা আপনার ওয়ালেটে জমা হবে।' },
      ],
      feeNote: 'মাসিক ফি, আপনি ঠিক করবেন',
      cutNote: 'আমরা রাখি ১৫% — আর কোনো খরচ নেই।',
      batchLabel: 'এখন চলছে',
      perMonth: '/ মাস',
      batches: [
        { tag: 'এইচএসসি · পদার্থবিজ্ঞান', title: 'এইচএসসি পদার্থবিজ্ঞান — সকাল', days: 'রবি · মঙ্গল · বৃহস্পতি', fee: '৳ 2,500' },
        { tag: 'নবম শ্রেণি · গণিত', title: 'নবম শ্রেণির গণিত', days: 'সোম · বুধ', fee: '৳ 1,800' },
        { tag: 'আইসিটি · ক্র্যাশ', title: 'আইসিটি ক্র্যাশ ব্যাচ', days: 'শুক্র', fee: '৳ 1,200' },
      ],
    };

    const en = {
      navCta: 'Get started',
      eyebrow: 'Teach without a coaching centre',
      h1a: 'Your class.',
      h1b: 'Your rules.',
      sub: 'Open a batch, run live classes, and collect the fees yourself — all in one place.',
      cta: 'Start as a teacher',
      cta2: 'Find a batch',
      note: 'Nothing to pay to start',
      howLabel: 'Three steps',
      steps: [
        { n: '1', title: 'Add your profile', body: 'Your name, subjects and certificates. We check them and approve you.' },
        { n: '2', title: 'Open a batch', body: 'Set the days, the time, how many seats, and the monthly fee.' },
        { n: '3', title: 'Collect the fees', body: 'Students pay by bKash or Nagad. The money lands in your wallet.' },
      ],
      feeNote: 'a month, set by you',
      cutNote: 'We keep 15% — there is nothing else to pay.',
      batchLabel: 'Running now',
      perMonth: '/ month',
      batches: [
        { tag: 'HSC · Physics', title: 'HSC Physics — Morning', days: 'Sun · Tue · Thu', fee: '৳ 2,500' },
        { tag: 'Class 9 · Maths', title: 'Class 9 Maths', days: 'Mon · Wed', fee: '৳ 1,800' },
        { tag: 'ICT · Crash', title: 'ICT Crash Batch', days: 'Fri', fee: '৳ 1,200' },
      ],
    };

    return { langs, t: lang === 'bn' ? bn : en };
  }
}
</script>
</body>
</html>
